# Debian Configuration
d-i debian-installer/language string en
d-i debian-installer/country string MA
d-i debian-installer/locale string en_US.UTF-8
# Keyboard Configuration
d-i keyboard-configuration/xkb-keymap select us
# Installer components
d-i anna/choose_modules string choose-mirror
# Networking Configuration
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/link_wait_timeout string 3
d-i netcfg/get_ipaddress string 10.0.2.8
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 10.0.2.2
d-i netcfg/get_nameservers string 10.0.2.3
d-i netcfg/confirm_static boolean true
d-i netcfg/get_hostname string ahmed
d-i netcfg/get_domain string local
# Users and passwords
    ## Allow login as root
d-i passwd/root-login boolean true
d-i passwd/root-password password 123
d-i passwd/root-password-again password 123
    ## Create a normal user account
d-i passwd/make-user boolean true
d-i passwd/user-fullname string ahmed
d-i passwd/username string ahmed
d-i passwd/user-password password 123
d-i passwd/user-password-again password 123
# Clock and time zone
d-i clock-setup/ntp boolean true
d-i clock-setup/utc boolean true
d-i clock-setup/ntp-server string 0.debian.pool.ntp.org
d-i time/zone string Africa/Casablanca
# Partitioning
d-i partman-partitioning/default_label string msdos
d-i partman-partitioning/confirm_new_label boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
    ## Disk to use and method: LVM
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string lvm
    ## Remove any old LVM or RAID found on the disk, without asking
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
    ## Name of the volume group, and use the whole disk for it
d-i partman-auto-lvm/new_vg_name string vg
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select lvmlayout
    ## Sizes are in MB: minimum, priority, maximum, filesystem
    ## /boot stays outside LVM; $lvmok{ } puts the others inside the LVM group
d-i partman-auto/expert_recipe string \
  lvmlayout :: \
    512 512 512 ext4 \
      $primary{ } $bootable{ } \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /boot } \
    . \
    5000 5000 5000 ext4 \
      $lvmok{ } lv_name{ root } \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ / } \
    . \
    2000 2000 2000 ext4 \
      $lvmok{ } lv_name{ home } \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /home } \
    . \
    2000 2000 2000 ext4 \
      $lvmok{ } lv_name{ var } \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /var } \
    . \
    1000 1000 1000 linux-swap \
      $lvmok{ } lv_name{ swap } \
      method{ swap } format{ } \
    .
    ## Confirmations: write the LVM and the partitions without asking
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Choose the kernel
d-i base-installer/kernel/image string linux-image-amd64
d-i base-installer/initramfs-tools/driver-policy select most
# Package manager
d-i apt-setup/cdrom/set-first boolean false
# Mirror
d-i apt-setup/use_mirror boolean true
d-i mirror/protocol string http
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
# Non Free Firmeware (virtual hardware doesn't need it)
d-i apt-setup/non-free-firmware boolean false
# Don't use non-free software
d-i apt-setup/non-free boolean false
# Don't use contrib software
d-i apt-setup/contrib boolean false
# Don't enable source repositories (deb-src)
d-i apt-setup/enable-source-repositories boolean false
# Update services to enable: security and release updates
d-i apt-setup/services-select multiselect security, updates
# Software selection
    ## Updates management: none = no automatic updates
d-i pkgsel/update-policy select none
    ## Don't upgrade packages after the installation
d-i pkgsel/upgrade select none
    ## Don't take part in the package usage survey
d-i popularity-contest/participate boolean false
    ## Software collections to install: standard system utilities only (no desktop)
d-i tasksel/first multiselect standard
    ## Include extra packages (like SSH server and sudo)
d-i pkgsel/include string openssh-server sudo curl
# GRUB Boot Loader Configuration
d-i grub-installer/os-prober boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda
# Finish Installation & Late Commands (Granting passwordless sudo)
d-i preseed/late_command string \
    in-target sh -c 'echo "ahmed ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/ahmed && chmod 0440 /etc/sudoers.d/ahmed'
d-i finish-install/reboot_in_progress note